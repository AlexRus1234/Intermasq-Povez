name: Зеркалирование Povez

# Ручной запуск кнопкой (не по пушу).
on:
  workflow_dispatch:

jobs:
  sync-mirrors:
    runs-on: docker
    container:
      # Используем сверхлегкий контейнер с Git
      image: docker.io/alpine/git:latest

    steps:
      - name: Настройка безопасности и клонирование
        run: |
          echo "=== Загружаем корневой сертификат нашего CA (Step-CA) ==="
          # Качаем публичный ключ доверия с нашего роутера
          wget --no-check-certificate https://172.20.0.1:9000/roots.pem -O /tmp/step-ca.crt

          echo "=== Настраиваем Git на доверие к нашей локальной сети ==="
          # Говорим Git проверять HTTPS-соединения по нашему сертификату
          git config --global http.sslCAInfo /tmp/step-ca.crt

          echo "=== Скачиваем код с домашнего сервера ==="
          # Клонируем репозиторий в текущую папку (точка в конце обязательна)
          git clone ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git .
          echo "=== Возвращаем стандартные сертификаты для остального интернета! ==="
          git config --global --unset http.sslCAInfo

      - name: Обозначение зеркала в README
        run: |
          set -e
          echo "Добавление отметки о зеркале в README (если есть)..."
          printf '%s\n' '> **Это зеркало репозитория. Оригинал находится по адресу:**' \
            '> [https://git.alexrus1234.ru/AlexRus1234/Intermasq-Povez](https://git.alexrus1234.ru/AlexRus1234/Intermasq-Povez)' '' > /tmp/mirror-notice-ru
          printf '%s\n' '> **This is a mirror repository. The original is available at:**' \
            '> [https://git.alexrus1234.ru/AlexRus1234/Intermasq-Povez](https://git.alexrus1234.ru/AlexRus1234/Intermasq-Povez)' '' > /tmp/mirror-notice-en

          git config user.name "Forgejo mirror"
          git config user.email "forgejo-mirror@localhost"

          NOTICE_ADDED=0
          if [ -f README.md ]; then
            cat /tmp/mirror-notice-ru README.md > README.md.tmp && mv README.md.tmp README.md
            git add README.md
            NOTICE_ADDED=1
          else
            echo "README.md не найден — пропуск"
          fi
          if [ -f README.en.md ]; then
            cat /tmp/mirror-notice-en README.en.md > README.en.md.tmp && mv README.en.md.tmp README.en.md
            git add README.en.md
            NOTICE_ADDED=1
          else
            echo "README.en.md не найден — пропуск"
          fi

          if [ "$NOTICE_ADDED" = "1" ]; then
            git commit -m "docs: mark repository as a mirror"
          else
            echo "Нет ни одного README — коммит отметки пропущен"
          fi

      - name: Отправка на GitHub
        continue-on-error: true
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
        run: |
          echo "Синхронизация с GitHub..."
          case "$GITHUB_REF" in
            refs/heads/*) git push --force https://AlexRus1234:${TOKEN_GITHUB}@github.com/AlexRus1234/Intermasq-Povez.git HEAD:main ;;
          esac
          git push https://AlexRus1234:${TOKEN_GITHUB}@github.com/AlexRus1234/Intermasq-Povez.git --tags

      - name: Отправка на Codeberg
        continue-on-error: true
        env:
          TOKEN_CODEBERG: ${{ secrets.TOKEN_CODEBERG }}
        run: |
          echo "Синхронизация с Codeberg..."
          case "$GITHUB_REF" in
            refs/heads/*) git push --force https://AlexRus1234:${TOKEN_CODEBERG}@codeberg.org/AlexRus1234/Intermasq-Povez.git HEAD:main ;;
          esac
          git push https://AlexRus1234:${TOKEN_CODEBERG}@codeberg.org/AlexRus1234/Intermasq-Povez.git --tags
